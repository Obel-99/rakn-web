<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAKN</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1A1916;
      color: #CFC7B8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .logos {
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .logo-name {
      width: 280px;
      margin-bottom: -50px;
      filter: brightness(0) invert(0.85) sepia(0.1) saturate(0.3);
    }
    .logo-runes {
      width: 180px;
      margin-top: -30px;
      filter: brightness(0) invert(0.85) sepia(0.1) saturate(0.3);
    }
    .tagline {
      font-size: 13px;
      color: #4A4842;
      font-style: italic;
      letter-spacing: 0.5px;
      margin-bottom: 40px;
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
    p { font-size: 15px; color: #CFC7B8; line-height: 1.6; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      background: #B5531F;
      color: #CFC7B8;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 8px;
      letter-spacing: 0.3px;
      border: none;
      cursor: pointer;
      width: 100%;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .hidden { display: none; }
    .input {
      width: 100%;
      background: #26251F;
      border: 1px solid #4A484244;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 15px;
      color: #CFC7B8;
      margin-bottom: 12px;
      outline: none;
    }
    .input:focus { border-color: #4A4842; }
    .input::placeholder { color: #4A4842; }
    .error { color: #B5531F; font-size: 14px; font-weight: 500; margin-bottom: 12px; }
    .success { color: #6B8F71; font-size: 14px; font-weight: 500; }
    .form { text-align: left; }
    .form h1 { text-align: center; }
    .form p { text-align: center; }
    .show-pw-btn {
      background: none;
      border: none;
      color: #4A4842;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      padding: 2px 0;
      margin-bottom: 12px;
      float: right;
    }
    .show-pw-btn:hover { color: #CFC7B8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logos">
      <img src="Name.png" alt="RAKN" class="logo-name" />
      <img src="Logo1.png" alt="ᚱᛅᚴᚾ" class="logo-runes" />
    </div>

    <!-- Default: landing page -->
    <div id="landing">
      <p class="tagline">Forged in motion. Led by purpose.</p>
      <p>Available on the App Store.</p>
    </div>

    <!-- Email confirmed -->
    <div id="auth" class="hidden">
      <div class="icon">✓</div>
      <h1 id="title">Email confirmed</h1>
      <p id="message">Your email has been verified. Go back to the app and log in.</p>
    </div>

    <!-- Password reset form -->
    <div id="recovery" class="hidden form">
      <h1>Set new password</h1>
      <div id="reset-error" class="error hidden"></div>
      <input id="pw1" class="input" type="password" placeholder="New password" autocomplete="new-password" oninput="updateShowBtn()" />
      <input id="pw2" class="input" type="password" placeholder="Confirm password" autocomplete="new-password" oninput="updateShowBtn()" />
      <button id="show-pw" class="show-pw-btn hidden" onclick="togglePasswords()">Show passwords</button>
      <button class="btn" id="reset-btn" onclick="handleReset()">Update Password</button>
    </div>

    <!-- Password reset success -->
    <div id="reset-success" class="hidden">
      <div class="icon">✓</div>
      <h1>Your password has been changed.</h1>
    </div>
  </div>

  <script>
    // Auth detection — runs immediately, no dependencies
    var fullUrl = window.location.href;
    var hash = window.location.hash.substring(1);
    var query = new URLSearchParams(window.location.search);

    var type = null;
    if (fullUrl.indexOf('type=recovery') !== -1) type = 'recovery';
    else if (fullUrl.indexOf('type=signup') !== -1) type = 'signup';
    else if (fullUrl.indexOf('access_token=') !== -1) type = 'signup';
    else if (query.get('code')) type = 'signup';

    if (type === 'recovery') {
      document.getElementById('landing').classList.add('hidden');
      document.getElementById('recovery').classList.remove('hidden');

    } else if (type) {
      document.getElementById('landing').classList.add('hidden');
      document.getElementById('auth').classList.remove('hidden');
    }
  </script>

  <!-- Supabase SDK — only needed for password reset form, loaded after page renders -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    var _supaClient = null;
    function getSupabase() {
      if (!_supaClient && window.supabase) {
        _supaClient = window.supabase.createClient(
          'https://bvolqcriwwdkdekkndrt.supabase.co',
          'sb_publishable_t54wisgOB_qmmG7eL0yI2A_n8PXe80O'
        );
        // Set session from URL tokens for password reset
        var params = new URLSearchParams(window.location.hash.substring(1));
        var at = params.get('access_token');
        var rt = params.get('refresh_token');
        if (at && rt) _supaClient.auth.setSession({ access_token: at, refresh_token: rt });
      }
      return _supaClient;
    }

    async function handleReset() {
      var pw1 = document.getElementById('pw1').value;
      var pw2 = document.getElementById('pw2').value;
      var errEl = document.getElementById('reset-error');
      var btn = document.getElementById('reset-btn');

      errEl.classList.add('hidden');

      if (!pw1 || pw1.length < 6) {
        errEl.textContent = 'Password must be at least 6 characters.';
        errEl.classList.remove('hidden');
        return;
      }
      if (pw1 !== pw2) {
        errEl.textContent = 'Passwords do not match.';
        errEl.classList.remove('hidden');
        return;
      }

      var client = getSupabase();
      if (!client) {
        errEl.textContent = 'Unable to connect. Please try again.';
        errEl.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Updating...';

      var result = await client.auth.updateUser({ password: pw1 });

      if (result.error) {
        errEl.textContent = result.error.message;
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Update Password';
      } else {
        document.getElementById('recovery').classList.add('hidden');
        document.getElementById('reset-success').classList.remove('hidden');
      }
    }

    function updateShowBtn() {
      var pw1 = document.getElementById('pw1').value;
      var pw2 = document.getElementById('pw2').value;
      var btn = document.getElementById('show-pw');
      if (pw1.length > 0 || pw2.length > 0) btn.classList.remove('hidden');
      else btn.classList.add('hidden');
    }

    function togglePasswords() {
      var pw1 = document.getElementById('pw1');
      var pw2 = document.getElementById('pw2');
      var btn = document.getElementById('show-pw');
      var showing = pw1.type === 'text';
      pw1.type = showing ? 'password' : 'text';
      pw2.type = showing ? 'password' : 'text';
      btn.textContent = showing ? 'Show passwords' : 'Hide passwords';
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !document.getElementById('recovery').classList.contains('hidden')) {
        handleReset();
      }
    });
  </script>
</body>
</html>
